<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 880" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#333"/>
    </marker>
  </defs>

  <rect width="780" height="880" fill="#fff"/>

  <!-- ========== A: INPUT ========== -->
  <text x="20" y="24" fill="#333" font-size="14" font-weight="700">a</text>

  <rect x="30" y="34" width="160" height="48" rx="6" fill="#e8f5e9" stroke="#2d7d46" stroke-width="1.2"/>
  <text x="110" y="55" text-anchor="middle" fill="#1b5e20" font-size="10" font-weight="700">TARGET</text>
  <text x="110" y="72" text-anchor="middle" fill="#333" font-size="11">VCF / BCF</text>

  <rect x="215" y="34" width="160" height="48" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.2"/>
  <text x="295" y="55" text-anchor="middle" fill="#bf360c" font-size="10" font-weight="700">REFERENCE PANEL</text>
  <text x="295" y="72" text-anchor="middle" fill="#333" font-size="11">SRP (single/multi-chr)</text>

  <rect x="400" y="34" width="160" height="48" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.2"/>
  <text x="480" y="55" text-anchor="middle" fill="#4a148c" font-size="10" font-weight="700">GENETIC MAP</text>
  <text x="480" y="72" text-anchor="middle" fill="#333" font-size="11">PLINK format</text>

  <rect x="585" y="34" width="165" height="48" rx="6" fill="#fafafa" stroke="#999" stroke-width="0.8" stroke-dasharray="4,2"/>
  <text x="668" y="55" text-anchor="middle" fill="#666" font-size="10" font-weight="700">OPTIONAL</text>
  <text x="668" y="72" text-anchor="middle" fill="#666" font-size="11">Pedigree (PED)</text>

  <!-- Arrows to bitmatrix -->
  <line x1="110" y1="82" x2="110" y2="103" stroke="#333" stroke-width="1" marker-end="url(#a)"/>
  <line x1="295" y1="82" x2="295" y2="103" stroke="#333" stroke-width="1" marker-end="url(#a)"/>

  <!-- Bitmatrix bar -->
  <rect x="30" y="106" width="530" height="30" rx="5" fill="#ede7f6" stroke="#5e35b1" stroke-width="1"/>
  <text x="295" y="126" text-anchor="middle" fill="#4527a0" font-size="11" font-weight="600">Bitmatrix extraction (1 bit per allele, SIMD-accelerated)</text>

  <line x1="295" y1="136" x2="295" y2="160" stroke="#333" stroke-width="1" marker-end="url(#a)"/>

  <!-- ========== B: PHASING ========== -->
  <text x="20" y="168" fill="#333" font-size="14" font-weight="700">b</text>

  <rect x="30" y="172" width="720" height="250" rx="8" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="390" y="193" text-anchor="middle" fill="#1565c0" font-size="13" font-weight="700">PHASING</text>
  <text x="390" y="208" text-anchor="middle" fill="#666" font-size="10">Auto-select: chip (up to 50K variants) -> Haploid | WGS (>50K) -> Diploid</text>

  <!-- Haploid box -->
  <rect x="50" y="220" width="330" height="130" rx="6" fill="#fff8e1" stroke="#f57f17" stroke-width="1.2"/>
  <text x="215" y="241" text-anchor="middle" fill="#e65100" font-size="12" font-weight="700">Haploid Engine</text>
  <text x="215" y="261" text-anchor="middle" fill="#333" font-size="10.5">Coded-step PBWT -> 280 composite haplotypes</text>
  <text x="215" y="278" text-anchor="middle" fill="#333" font-size="10.5">3-channel HMM + greedy swap (15 iterations)</text>
  <text x="215" y="295" text-anchor="middle" fill="#333" font-size="10.5">Adaptive step scale (fine -> coarse)</text>
  <text x="215" y="312" text-anchor="middle" fill="#333" font-size="10.5">Rare carrier injection + EM per-window</text>
  <text x="215" y="340" text-anchor="middle" fill="#888" font-size="9" font-style="italic">Optimized for genotyping arrays</text>

  <!-- Diploid box -->
  <rect x="400" y="220" width="330" height="130" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
  <text x="565" y="241" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="700">Diploid Engine</text>
  <text x="565" y="261" text-anchor="middle" fill="#333" font-size="10.5">Genotype graph + MCMC (15 iterations)</text>
  <text x="565" y="278" text-anchor="middle" fill="#333" font-size="10.5">EM Ne estimation during burn-in</text>
  <text x="565" y="295" text-anchor="middle" fill="#333" font-size="10.5">Common -> rare two-stage (PBWT voting)</text>
  <text x="565" y="312" text-anchor="middle" fill="#333" font-size="10.5">IBD2 exclusion + singleton IBD phasing</text>
  <text x="565" y="340" text-anchor="middle" fill="#888" font-size="9" font-style="italic">Optimized for whole-genome sequencing</text>

  <!-- Phase refinement -->
  <rect x="150" y="362" width="480" height="26" rx="4" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="0.8"/>
  <text x="390" y="380" text-anchor="middle" fill="#6a1b9a" font-size="10.5">Phase refinement: bidirectional IBD crossover detection + Viterbi HMM</text>

  <!-- Pedigree arrow -->
  <path d="M668 82 L668 200 L735 200 L735 280 L730 280" fill="none" stroke="#999" stroke-width="0.8" stroke-dasharray="4,2" marker-end="url(#a)"/>
  <text x="743" y="245" fill="#888" font-size="8.5" transform="rotate(90,743,245)" text-anchor="middle">Mendelian scaffold</text>

  <!-- Pre-phased bypass -->
  <path d="M30 82 L14 82 L14 550 L28 550" fill="none" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#a)"/>
  <text x="8" y="340" fill="#1565c0" font-size="9" font-weight="600" transform="rotate(-90,8,340)" text-anchor="middle">pre-phased input</text>

  <!-- Handoff -->
  <rect x="130" y="428" width="520" height="22" rx="4" fill="#e8f5e9" stroke="#2d7d46" stroke-width="0.8" stroke-dasharray="5,3"/>
  <text x="390" y="443" text-anchor="middle" fill="#2d7d46" font-size="10">In-memory handoff (no intermediate file I/O)</text>

  <line x1="390" y1="450" x2="390" y2="476" stroke="#333" stroke-width="1" marker-end="url(#a)"/>

  <!-- ========== C: IMPUTATION ========== -->
  <text x="20" y="486" fill="#333" font-size="14" font-weight="700">c</text>

  <rect x="30" y="490" width="720" height="190" rx="8" fill="#fff" stroke="#c2185b" stroke-width="1.5"/>
  <text x="390" y="511" text-anchor="middle" fill="#c2185b" font-size="13" font-weight="700">IMPUTATION</text>

  <!-- Three sub-steps -->
  <rect x="50" y="524" width="200" height="56" rx="5" fill="#fce4ec" stroke="#c2185b" stroke-width="0.8"/>
  <text x="150" y="545" text-anchor="middle" fill="#880e4f" font-size="11" font-weight="600">PBWT Matching</text>
  <text x="150" y="562" text-anchor="middle" fill="#555" font-size="9.5">Coded-step on bitmatrix</text>
  <text x="150" y="574" text-anchor="middle" fill="#555" font-size="9.5">up to 2,500 candidates</text>

  <line x1="250" y1="552" x2="275" y2="552" stroke="#333" stroke-width="1" marker-end="url(#a)"/>

  <rect x="278" y="524" width="200" height="56" rx="5" fill="#fce4ec" stroke="#c2185b" stroke-width="0.8"/>
  <text x="378" y="545" text-anchor="middle" fill="#880e4f" font-size="11" font-weight="600">Li-Stephens HMM</text>
  <text x="378" y="562" text-anchor="middle" fill="#555" font-size="9.5">f32 forward + f64 backward</text>
  <text x="378" y="574" text-anchor="middle" fill="#555" font-size="9.5">Haplotype deduplication</text>

  <line x1="478" y1="552" x2="503" y2="552" stroke="#333" stroke-width="1" marker-end="url(#a)"/>

  <rect x="506" y="524" width="224" height="56" rx="5" fill="#fce4ec" stroke="#c2185b" stroke-width="0.8"/>
  <text x="618" y="545" text-anchor="middle" fill="#880e4f" font-size="11" font-weight="600">Adaptive Ne = 36 &#xd7; n_ref</text>
  <text x="618" y="562" text-anchor="middle" fill="#555" font-size="9.5">Panel-size calibrated</text>
  <text x="618" y="574" text-anchor="middle" fill="#555" font-size="9.5">MAF-adaptive per-site scaling</text>

  <!-- Tiled interpolation -->
  <rect x="80" y="596" width="620" height="42" rx="5" fill="#f8f9fa" stroke="#aaa" stroke-width="0.8"/>
  <text x="390" y="614" text-anchor="middle" fill="#333" font-size="11" font-weight="600">Tiled Interpolation (1,024 x 4,096 tiles, L2-cache optimized)</text>
  <text x="390" y="630" text-anchor="middle" fill="#666" font-size="10">Fused interpolate -> encode -> drop per tile | DR2 two-pass | LD-corrected distances</text>

  <!-- Arrow to bottom -->
  <rect x="50" y="646" width="680" height="26" rx="4" fill="#e8f5e9" stroke="#2d7d46" stroke-width="0.8"/>
  <text x="390" y="664" text-anchor="middle" fill="#2d7d46" font-size="10">Streaming output: tiles encoded and written immediately (never accumulate full chromosome)</text>

  <line x1="390" y1="680" x2="390" y2="706" stroke="#333" stroke-width="1" marker-end="url(#a)"/>

  <!-- ========== D: OUTPUT ========== -->
  <text x="20" y="716" fill="#333" font-size="14" font-weight="700">d</text>

  <rect x="30" y="720" width="720" height="60" rx="8" fill="#fff" stroke="#2d7d46" stroke-width="1.5"/>
  <text x="390" y="741" text-anchor="middle" fill="#1b5e20" font-size="12" font-weight="700">Multi-Format Output (single interpolation pass)</text>

  <!-- Format pills (centered: 5 pills + 4 gaps = 610px total, box=720, margin=55 each side) -->
  <rect x="85" y="750" width="100" height="22" rx="11" fill="#e8f5e9" stroke="#2d7d46" stroke-width="0.8"/>
  <text x="135" y="765" text-anchor="middle" fill="#1b5e20" font-size="10" font-weight="600">VCF.gz</text>

  <rect x="200" y="750" width="100" height="22" rx="11" fill="#e8f5e9" stroke="#2d7d46" stroke-width="0.8"/>
  <text x="250" y="765" text-anchor="middle" fill="#1b5e20" font-size="10" font-weight="600">BCF 2.2</text>

  <rect x="315" y="750" width="100" height="22" rx="11" fill="#e8f5e9" stroke="#2d7d46" stroke-width="0.8"/>
  <text x="365" y="765" text-anchor="middle" fill="#1b5e20" font-size="10" font-weight="600">Parquet</text>

  <rect x="430" y="750" width="140" height="22" rx="11" fill="#e8f5e9" stroke="#2d7d46" stroke-width="0.8"/>
  <text x="500" y="765" text-anchor="middle" fill="#1b5e20" font-size="10" font-weight="600">PGEN + dosage</text>

  <rect x="585" y="750" width="110" height="22" rx="11" fill="#e8f5e9" stroke="#2d7d46" stroke-width="0.8"/>
  <text x="640" y="765" text-anchor="middle" fill="#1b5e20" font-size="10" font-weight="600">SelfDecode</text>

  <!-- ========== E: FEATURES BAR ========== -->
  <text x="20" y="808" fill="#333" font-size="14" font-weight="700">e</text>

  <rect x="30" y="812" width="345" height="48" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="0.8"/>
  <text x="203" y="832" text-anchor="middle" fill="#bf360c" font-size="11" font-weight="600">Multi-chromosome processing</text>
  <text x="203" y="849" text-anchor="middle" fill="#666" font-size="10">Single SRP file, overlapped prefetch</text>

  <rect x="395" y="812" width="355" height="48" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="0.8"/>
  <text x="573" y="832" text-anchor="middle" fill="#0d47a1" font-size="11" font-weight="600">Mixed-density reference panels</text>
  <text x="573" y="849" text-anchor="middle" fill="#666" font-size="10">WGS + chip augmentation, no pre-imputation</text>
</svg>
