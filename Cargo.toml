[package]
name = "selphi"
version = "2.0.0"
edition = "2024"

[lib]
name = "selphi"

[[bin]]
name = "selphi"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
zip = "2"
zstd = { version = "0.13", features = ["zstdmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
blake2 = "0.10"
noodles-bgzf = "0.46"
noodles-bcf = "0.78"
noodles-vcf = "0.82"
lazy_static = "1.5"
rand = { version = "0.8", features = ["small_rng"] }
rand_mt = "4"
num_cpus = "1"
tempfile = "3"
arrow = { version = "54", features = ["prettyprint"] }
parquet = { version = "54", features = ["zstd", "snap"] }
memmap2 = "0.9"
lz4_flex = "0.11"
mimalloc = { version = "0.1", default-features = false, optional = true }

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
