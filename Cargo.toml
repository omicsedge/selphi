[package]
name = "selphi"
version = "2.0.0"
edition = "2024"

[lib]
name = "selphi"

[[bin]]
name = "selphi"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
zip = "2"
zstd = { version = "0.13", features = ["zstdmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
blake2 = "0.10"
libc = "0.2"
noodles-bgzf = "0.46"
noodles-bcf = "0.78"
noodles-vcf = "0.81"
noodles-bam = "0.90"
# The .bai index's per-reference record counts (whether a BAM holds other chromosomes).
noodles-csi = "0.56"
noodles-sam = "0.85"
noodles-core = "0.20"
# The VCF/BCF readers are built on noodles-core 0.18: their indexed queries take its Region.
noodles-core-vcf = { package = "noodles-core", version = "0.18" }
noodles-cram = "0.94"
noodles-fasta = "0.62"
lazy_static = "1.5"
rand = { version = "0.8", features = ["small_rng"] }
rand_mt = "4"
num_cpus = "1"
tempfile = "3"
arrow = { version = "54", features = ["prettyprint"] }
parquet = { version = "54", features = ["zstd", "snap"] }
memmap2 = "0.9"
lz4_flex = "0.11"
memchr = "2"
mimalloc = { version = "0.1", default-features = false, optional = true }
libmimalloc-sys = { version = "0.1", features = ["extended"], optional = true }

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
