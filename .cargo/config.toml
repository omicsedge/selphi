# Portable production baseline (per target — `[build]` rustflags would leak
# `x86-64-v3` to aarch64 builds and fail).
#
# x86-64-v3 = Haswell (2013): AVX, AVX2, FMA, BMI1, BMI2, F16C, LZCNT, MOVBE,
# POPCNT, SSE 4.2. Supported by every modern AWS instance and every x86 CPU
# shipped in the last ~10 years.
#
# AVX-512 is NOT in v3 — it is opted into at function granularity via
# `#[target_feature(enable = "avx512f,...")]` plus runtime
# `is_x86_feature_detected!` dispatch (see `diploid/hmm_segment.rs::use_avx512`
# and `haploid/simd.rs`). One binary runs on AVX-512 hosts (c5/c6/c7i) AND
# non-AVX-512 hosts (c5a/c6a/c7a, m4/c4).
#
# To build for the local CPU (no portability), use:
#   RUSTFLAGS="-C target-cpu=native" cargo build --release
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=neoverse-n1"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-m1"]
