<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="16" y="26" fill="#e6edf3" font-size="16" font-weight="700">Whole-genome phasing + imputation &#183; wall time</text>
<text x="16" y="46" fill="#8b949e" font-size="12">6 samples vs the 75,552-haplotype reference panel &#183; 22 autosomes &#183; 16 threads &#183; same machine and session</text>
<text x="120" y="101" text-anchor="end" fill="#c9d1d9" font-size="13" font-weight="600">Selphi 2</text>
<rect x="132" y="78" width="287.9" height="38" rx="5" fill="#58a6ff"/>
<text x="429.9" y="102" fill="#e6edf3" font-size="14" font-weight="700">18.3 min</text>
<text x="429.9" y="88" fill="#8b949e" font-size="10">18:19 (mm:ss)</text>
<text x="120" y="159" text-anchor="end" fill="#c9d1d9" font-size="13" font-weight="600">Beagle 5.5</text>
<rect x="132" y="136" width="470.0" height="38" rx="5" fill="#d29922"/>
<text x="612.0" y="160" fill="#e6edf3" font-size="14" font-weight="700">29.9 min</text>
<text x="612.0" y="146" fill="#8b949e" font-size="10">29:54 (mm:ss)</text>
<text x="16" y="210" fill="#3fb950" font-size="13" font-weight="700">Selphi 2 is 1.6&#215; faster end-to-end (11.6 min saved)</text>
<text x="16" y="232" fill="#8b949e" font-size="12">Peak memory 6.8 GB for Selphi 2 vs 41.9-55.1 GB for Beagle 5.5</text>
</svg>
