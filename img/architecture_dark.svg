<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 792" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#8b949e" stroke-width="1.2"/>
    </marker>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2333"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="gl">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="920" height="792" rx="12" fill="#0d1117"/>

  <text x="460" y="34" text-anchor="middle" fill="#e6edf3" font-size="18" font-weight="600">Selphi 2 — Pipeline Architecture</text>

  <!-- INPUT ROW -->
  <rect x="30" y="54" width="195" height="50" rx="8" fill="#0d1117" stroke="#238636" stroke-width="1.5"/>
  <text x="128" y="75" text-anchor="middle" fill="#7ee787" font-size="11" font-weight="600">INPUT</text>
  <text x="128" y="92" text-anchor="middle" fill="#c9d1d9" font-size="12">VCF / BCF / BAM / CRAM</text>

  <rect x="248" y="54" width="195" height="50" rx="8" fill="#0d1117" stroke="#d29922" stroke-width="1.5"/>
  <text x="346" y="75" text-anchor="middle" fill="#d29922" font-size="11" font-weight="600">REFERENCE</text>
  <text x="346" y="92" text-anchor="middle" fill="#c9d1d9" font-size="13">SRP Panel</text>

  <rect x="466" y="54" width="195" height="50" rx="8" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/>
  <text x="564" y="75" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="600">GENETIC MAP</text>
  <text x="564" y="92" text-anchor="middle" fill="#c9d1d9" font-size="13">PLINK / directory</text>

  <rect x="684" y="54" width="205" height="50" rx="8" fill="#0d1117" stroke="#6e7681" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="787" y="75" text-anchor="middle" fill="#6e7681" font-size="11" font-weight="600">OPTIONAL</text>
  <text x="787" y="92" text-anchor="middle" fill="#8b949e" font-size="13">Pedigree / Haploids</text>

  <line x1="128" y1="104" x2="128" y2="134" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="346" y1="104" x2="346" y2="134" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- BITMATRIX -->
  <rect x="60" y="136" width="640" height="38" rx="10" fill="url(#sg)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="380" y="153" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="700">Bitmatrix Extraction</text>
  <text x="380" y="168" text-anchor="middle" fill="#8b949e" font-size="11">1 bit per allele · shared between phasing and imputation · SIMD-accelerated</text>

  <line x1="380" y1="174" x2="380" y2="200" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- PHASING CONTAINER: two engines, auto-selected -->
  <rect x="50" y="202" width="820" height="186" rx="10" fill="url(#sg)" stroke="#1f6feb" stroke-width="1.5" filter="url(#gl)"/>
  <text x="460" y="224" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">Phasing</text>
  <text x="460" y="241" text-anchor="middle" fill="#8b949e" font-size="11">if unphased — auto by density: chip (up to 50K) &#x2192; haploid | WGS (&gt;50K) &#x2192; diploid</text>

  <rect x="70" y="252" width="380" height="124" rx="8" fill="#0d1117" stroke="#f97316" stroke-width="1.2"/>
  <text x="260" y="274" text-anchor="middle" fill="#fb923c" font-size="13" font-weight="700">Haploid Engine</text>
  <text x="260" y="295" text-anchor="middle" fill="#c9d1d9" font-size="11.5">Coded-step PBWT &#x2192; 280 composites</text>
  <text x="260" y="313" text-anchor="middle" fill="#c9d1d9" font-size="11.5">3-channel composite HMM + greedy swap</text>
  <text x="260" y="331" text-anchor="middle" fill="#c9d1d9" font-size="11.5">Adaptive step scale + carrier injection</text>
  <text x="260" y="349" text-anchor="middle" fill="#c9d1d9" font-size="11.5">EM per-window (Ne, mismatch) · 15 iter</text>
  <text x="260" y="369" text-anchor="middle" fill="#8b949e" font-size="10" font-style="italic">optimal for chip arrays</text>

  <rect x="470" y="252" width="380" height="124" rx="8" fill="#0d1117" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="660" y="274" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="700">Diploid Engine</text>
  <text x="660" y="295" text-anchor="middle" fill="#c9d1d9" font-size="11.5">Genotype graph + MCMC (5b,3xp/b,5m)</text>
  <text x="660" y="313" text-anchor="middle" fill="#c9d1d9" font-size="11.5">EM Ne estimation during burn-in</text>
  <text x="660" y="331" text-anchor="middle" fill="#c9d1d9" font-size="11.5">Common &#x2192; rare two-stage phasing</text>
  <text x="660" y="349" text-anchor="middle" fill="#c9d1d9" font-size="11.5">IBD2-aware PBWT + singleton IBD</text>
  <text x="660" y="369" text-anchor="middle" fill="#8b949e" font-size="10" font-style="italic">optimal for WGS</text>

  <!-- Pedigree arrow -->
  <path d="M787 104 L787 188 L895 188 L895 305 L872 305" fill="none" stroke="#6e7681" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="905" y="250" fill="#6e7681" font-size="9" transform="rotate(90,905,250)" text-anchor="middle">Mendelian scaffold</text>

  <!-- Pre-phased bypass -->
  <path d="M 28 104 L 12 104 L 12 540 L 48 540" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr)"/>
  <text x="5" y="320" fill="#58a6ff" font-size="10" font-weight="600" transform="rotate(-90,5,320)" text-anchor="middle">pre-phased -> skip</text>

  <!-- Phasing -> handoff -> imputation -->
  <line x1="460" y1="388" x2="460" y2="404" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="140" y="406" width="640" height="28" rx="8" fill="#0d1117" stroke="#238636" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="460" y="425" text-anchor="middle" fill="#7ee787" font-size="11">In-memory handoff: phased haplotypes + reference bitmatrix (no intermediate I/O)</text>
  <line x1="460" y1="434" x2="460" y2="450" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- IMPUTATION CONTAINER: two engines, auto-selected by input -->
  <rect x="50" y="452" width="820" height="186" rx="10" fill="url(#sg)" stroke="#ec4899" stroke-width="1.5" filter="url(#gl)"/>
  <text x="460" y="474" text-anchor="middle" fill="#f472b6" font-size="14" font-weight="700">Imputation</text>
  <text x="460" y="491" text-anchor="middle" fill="#8b949e" font-size="11">auto by input: confident genotypes &#x2192; genotype engine | low-coverage GL / reads &#x2192; lcWGS engine</text>

  <rect x="70" y="502" width="380" height="104" rx="8" fill="#0d1117" stroke="#ec4899" stroke-width="1.2"/>
  <text x="260" y="523" text-anchor="middle" fill="#f9a8d4" font-size="13" font-weight="700">Genotype Imputation</text>
  <text x="260" y="539" text-anchor="middle" fill="#8b949e" font-size="10">chip / WGS confident hard calls</text>
  <text x="260" y="559" text-anchor="middle" fill="#c9d1d9" font-size="11.5">PBWT selection + Li-Stephens HMM (f32/f64)</text>
  <text x="260" y="577" text-anchor="middle" fill="#c9d1d9" font-size="11.5">Haplotype dedup · Adaptive Ne = 36 &#xd7; n_ref</text>
  <text x="260" y="597" text-anchor="middle" fill="#f472b6" font-size="10" font-style="italic">hard calls in &#x2192; dosages out</text>

  <rect x="470" y="502" width="380" height="104" rx="8" fill="#0d1117" stroke="#2dd4bf" stroke-width="1.2"/>
  <text x="660" y="523" text-anchor="middle" fill="#5eead4" font-size="13" font-weight="700">Low-Coverage WGS Imputation</text>
  <text x="660" y="539" text-anchor="middle" fill="#8b949e" font-size="10">low-coverage sequencing (genotype likelihoods)</text>
  <text x="660" y="559" text-anchor="middle" fill="#c9d1d9" font-size="11.5">PL VCF / BAM / CRAM · sparse-PBWT &#x21c4; GL-weighted FB</text>
  <text x="660" y="577" text-anchor="middle" fill="#c9d1d9" font-size="11.5">&#x221a;n-checkpointed · diplotype-mosaic Gibbs</text>
  <text x="660" y="597" text-anchor="middle" fill="#2dd4bf" font-size="10" font-style="italic">GLs in &#x2192; GT:DS:GP out</text>

  <text x="460" y="626" text-anchor="middle" fill="#c9d1d9" font-size="11">Tiled interpolation (1024 &#xd7; 4096, L2-cache) · fused interp&#x2192;encode&#x2192;stream · DR2 two-pass · LD-corrected</text>

  <line x1="460" y1="638" x2="460" y2="664" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- OUTPUT -->
  <rect x="50" y="666" width="820" height="50" rx="10" fill="url(#sg)" stroke="#238636" stroke-width="1.5"/>
  <text x="460" y="686" text-anchor="middle" fill="#7ee787" font-size="13" font-weight="700">Multi-Format Output (single interpolation pass)</text>
  <rect x="113" y="696" width="120" height="18" rx="4" fill="#238636" opacity="0.2"/>
  <text x="173" y="709" text-anchor="middle" fill="#7ee787" font-size="11" font-weight="600">VCF.gz</text>
  <rect x="248" y="696" width="120" height="18" rx="4" fill="#238636" opacity="0.2"/>
  <text x="308" y="709" text-anchor="middle" fill="#7ee787" font-size="11" font-weight="600">BCF 2.2</text>
  <rect x="383" y="696" width="120" height="18" rx="4" fill="#238636" opacity="0.2"/>
  <text x="443" y="709" text-anchor="middle" fill="#7ee787" font-size="11" font-weight="600">Parquet</text>
  <rect x="518" y="696" width="155" height="18" rx="4" fill="#238636" opacity="0.2"/>
  <text x="596" y="709" text-anchor="middle" fill="#7ee787" font-size="11" font-weight="600">PGEN + dosage</text>
  <rect x="688" y="696" width="120" height="18" rx="4" fill="#238636" opacity="0.2"/>
  <text x="748" y="709" text-anchor="middle" fill="#7ee787" font-size="11" font-weight="600">SelfDecode</text>

  <!-- Multi-chr note -->
  <rect x="50" y="728" width="820" height="28" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="460" y="747" text-anchor="middle" fill="#d29922" font-size="11">Multi-chromosome: single SRP file, overlapped prefetch | Mixed-density: WGS + chip merged-panel builder</text>

  <!-- ===== auto-route animation: each scenario lights its active path and dims the rest (SMIL, 15s loop) ===== -->
  <!-- scenario captions (top-right, beside the title) -->
  <text x="886" y="34" text-anchor="end" font-size="12" font-weight="700" fill="#f97316" opacity="0">&#x25b6; chip array &#x2192; haploid + genotype
    <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.31;0.35;0.64;0.68;0.97;1" dur="15s" repeatCount="indefinite"/></text>
  <text x="886" y="34" text-anchor="end" font-size="12" font-weight="700" fill="#2563eb" opacity="0">&#x25b6; WGS &#x2192; diploid + genotype
    <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.31;0.35;0.64;0.68;0.97;1" dur="15s" repeatCount="indefinite"/></text>
  <text x="886" y="34" text-anchor="end" font-size="12" font-weight="700" fill="#0d9488" opacity="0">&#x25b6; low-coverage &#x2192; lcWGS engine
    <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.31;0.35;0.64;0.68;0.97;1" dur="15s" repeatCount="indefinite"/></text>

  <!-- dim scrims over the boxes NOT on the active path -->
  <g>
    <rect x="70" y="252" width="380" height="124" rx="8" fill="#0d1117" opacity="0">
      <animate attributeName="opacity" values="0;0;0.75;0.75;0.75;0.75;0" keyTimes="0;0.31;0.35;0.64;0.68;0.97;1" dur="15s" repeatCount="indefinite"/></rect>
    <rect x="470" y="252" width="380" height="124" rx="8" fill="#0d1117" opacity="0">
      <animate attributeName="opacity" values="0.75;0.75;0;0;0.75;0.75;0.75" keyTimes="0;0.31;0.35;0.64;0.68;0.97;1" dur="15s" repeatCount="indefinite"/></rect>
    <rect x="49" y="201" width="822" height="188" rx="10" fill="#0d1117" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0.75;0.75;0" keyTimes="0;0.31;0.35;0.64;0.68;0.97;1" dur="15s" repeatCount="indefinite"/></rect>
    <rect x="140" y="406" width="640" height="28" rx="8" fill="#0d1117" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0.75;0.75;0" keyTimes="0;0.31;0.35;0.64;0.68;0.97;1" dur="15s" repeatCount="indefinite"/></rect>
    <rect x="70" y="502" width="380" height="104" rx="8" fill="#0d1117" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0.75;0.75;0" keyTimes="0;0.31;0.35;0.64;0.68;0.97;1" dur="15s" repeatCount="indefinite"/></rect>
    <rect x="470" y="502" width="380" height="104" rx="8" fill="#0d1117" opacity="0">
      <animate attributeName="opacity" values="0.75;0.75;0.75;0.75;0;0;0.75" keyTimes="0;0.31;0.35;0.64;0.68;0.97;1" dur="15s" repeatCount="indefinite"/></rect>
  </g>

  <!-- glow rings on the active path -->
  <g fill="none">
    <rect x="30" y="54" width="195" height="50" rx="8" stroke="#16a34a" stroke-width="2" opacity="0.65"/>
    <rect x="60" y="136" width="640" height="38" rx="10" stroke="#16a34a" stroke-width="2" opacity="0.6"/>
    <rect x="50" y="666" width="820" height="50" rx="10" stroke="#16a34a" stroke-width="2" opacity="0.65"/>
    <rect x="70" y="252" width="380" height="124" rx="8" stroke="#f97316" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.31;0.35;0.64;0.68;0.97;1" dur="15s" repeatCount="indefinite"/></rect>
    <rect x="470" y="252" width="380" height="124" rx="8" stroke="#2563eb" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.31;0.35;0.64;0.68;0.97;1" dur="15s" repeatCount="indefinite"/></rect>
    <rect x="140" y="406" width="640" height="28" rx="8" stroke="#16a34a" stroke-width="2.5" opacity="0">
      <animate attributeName="opacity" values="1;1;1;1;0;0;1" keyTimes="0;0.31;0.35;0.64;0.68;0.97;1" dur="15s" repeatCount="indefinite"/></rect>
    <rect x="70" y="502" width="380" height="104" rx="8" stroke="#db2777" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="1;1;1;1;0;0;1" keyTimes="0;0.31;0.35;0.64;0.68;0.97;1" dur="15s" repeatCount="indefinite"/></rect>
    <rect x="470" y="502" width="380" height="104" rx="8" stroke="#0d9488" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.31;0.35;0.64;0.68;0.97;1" dur="15s" repeatCount="indefinite"/></rect>
  </g>
</svg>
