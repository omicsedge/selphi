<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 882" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#57606a" stroke-width="1.2"/>
    </marker>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f8fa"/>
      <stop offset="100%" stop-color="#eef1f5"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="920" height="882" rx="12" fill="#ffffff"/>

  <text x="460" y="38" text-anchor="middle" fill="#1f2328" font-size="18" font-weight="600">Selphi 2 — Pipeline Architecture</text>

  <!-- INPUT ROW -->
  <rect x="30" y="62" width="195" height="52" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5" filter="url(#sh)"/>
  <text x="128" y="84" text-anchor="middle" fill="#1a7f37" font-size="11" font-weight="600">INPUT</text>
  <text x="128" y="101" text-anchor="middle" fill="#1f2328" font-size="13">Target VCF/BCF</text>

  <rect x="248" y="62" width="195" height="52" rx="8" fill="#ffffff" stroke="#9a6700" stroke-width="1.5" filter="url(#sh)"/>
  <text x="346" y="84" text-anchor="middle" fill="#9a6700" font-size="11" font-weight="600">REFERENCE</text>
  <text x="346" y="101" text-anchor="middle" fill="#1f2328" font-size="13">SRP Panel</text>

  <rect x="466" y="62" width="195" height="52" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="564" y="84" text-anchor="middle" fill="#57606a" font-size="11" font-weight="600">GENETIC MAP</text>
  <text x="564" y="101" text-anchor="middle" fill="#1f2328" font-size="13">PLINK / directory</text>

  <rect x="684" y="62" width="205" height="52" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1" stroke-dasharray="4,3" filter="url(#sh)"/>
  <text x="787" y="84" text-anchor="middle" fill="#8c959f" font-size="11" font-weight="600">OPTIONAL</text>
  <text x="787" y="101" text-anchor="middle" fill="#57606a" font-size="13">Pedigree / Haploids</text>

  <line x1="128" y1="114" x2="128" y2="144" stroke="#57606a" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="346" y1="114" x2="346" y2="144" stroke="#57606a" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- BITMATRIX -->
  <rect x="60" y="146" width="640" height="40" rx="10" fill="url(#sg)" stroke="#8250df" stroke-width="1.5" filter="url(#sh)"/>
  <text x="380" y="163" text-anchor="middle" fill="#8250df" font-size="12" font-weight="700">Bitmatrix Extraction</text>
  <text x="380" y="179" text-anchor="middle" fill="#57606a" font-size="11">1 bit per allele · shared between phasing and imputation · SIMD-accelerated</text>

  <line x1="380" y1="186" x2="380" y2="214" stroke="#57606a" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- PHASING AUTO-DETECT -->
  <rect x="50" y="216" width="820" height="28" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
  <text x="460" y="235" text-anchor="middle" fill="#0969da" font-size="12" font-weight="600">Phasing (if unphased) — auto: chip (up to 50K vars) -> haploid | WGS (>50K) -> diploid</text>

  <!-- HAPLOID ENGINE -->
  <rect x="50" y="256" width="400" height="135" rx="10" fill="url(#sg)" stroke="#bc4c00" stroke-width="1.5" filter="url(#sh)"/>
  <text x="250" y="280" text-anchor="middle" fill="#bc4c00" font-size="14" font-weight="700">Haploid Engine</text>
  <text x="250" y="303" text-anchor="middle" fill="#1f2328" font-size="12">Coded-step PBWT -> 280 composites</text>
  <text x="250" y="322" text-anchor="middle" fill="#1f2328" font-size="12">3-channel composite HMM + greedy swap</text>
  <text x="250" y="341" text-anchor="middle" fill="#1f2328" font-size="12">Adaptive step scale + carrier injection</text>
  <text x="250" y="360" text-anchor="middle" fill="#1f2328" font-size="12">EM per-window (Ne, mismatch) · 15 iter</text>
  <text x="250" y="381" text-anchor="middle" fill="#57606a" font-size="10">Optimal for chip arrays</text>

  <!-- DIPLOID ENGINE -->
  <rect x="470" y="256" width="400" height="135" rx="10" fill="url(#sg)" stroke="#0969da" stroke-width="1.5" filter="url(#sh)"/>
  <text x="670" y="280" text-anchor="middle" fill="#0969da" font-size="14" font-weight="700">Diploid Engine</text>
  <text x="670" y="303" text-anchor="middle" fill="#1f2328" font-size="12">Genotype graph + MCMC (5b,3xp/b,5m)</text>
  <text x="670" y="322" text-anchor="middle" fill="#1f2328" font-size="12">EM Ne estimation during burn-in</text>
  <text x="670" y="341" text-anchor="middle" fill="#1f2328" font-size="12">Common -> rare two-stage phasing</text>
  <text x="670" y="360" text-anchor="middle" fill="#1f2328" font-size="12">IBD2-aware PBWT + singleton IBD</text>
  <text x="670" y="381" text-anchor="middle" fill="#57606a" font-size="10">Optimal for WGS</text>

  <!-- Phase refinement -->
  <rect x="200" y="402" width="520" height="30" rx="6" fill="url(#sg)" stroke="#8250df" stroke-width="1" filter="url(#sh)"/>
  <text x="460" y="422" text-anchor="middle" fill="#8250df" font-size="12">Phase refinement: bidirectional IBD crossover + 2-state Viterbi HMM</text>

  <!-- Pedigree arrow (stays outside diploid box right edge at x=870) -->
  <path d="M787 114 L787 190 L885 190 L885 310 L870 310" fill="none" stroke="#8c959f" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="895" y="255" fill="#8c959f" font-size="9" transform="rotate(90,895,255)" text-anchor="middle">Mendelian scaffold</text>

  <!-- Bypass arrow -->
  <path d="M 28 114 L 12 114 L 12 510 L 48 510" fill="none" stroke="#0969da" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr)"/>
  <text x="5" y="330" fill="#0969da" font-size="10" font-weight="600" transform="rotate(-90,5,330)" text-anchor="middle">pre-phased -> skip</text>

  <!-- In-memory handoff -->
  <rect x="140" y="445" width="640" height="28" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="460" y="464" text-anchor="middle" fill="#1a7f37" font-size="11">In-memory handoff: phased haplotypes + reference bitmatrix (no intermediate I/O)</text>

  <line x1="460" y1="473" x2="460" y2="498" stroke="#57606a" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- IMPUTATION -->
  <rect x="50" y="500" width="820" height="130" rx="10" fill="url(#sg)" stroke="#bf3989" stroke-width="1.5" filter="url(#sh)"/>
  <text x="460" y="524" text-anchor="middle" fill="#bf3989" font-size="14" font-weight="700">Imputation Engine</text>

  <rect x="70" y="536" width="235" height="44" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="0.8"/>
  <text x="188" y="554" text-anchor="middle" fill="#1f2328" font-size="12" font-weight="600">PBWT Matching</text>
  <text x="188" y="572" text-anchor="middle" fill="#57606a" font-size="11">Coded-step, bitmatrix-native</text>

  <rect x="325" y="536" width="235" height="44" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="0.8"/>
  <text x="443" y="554" text-anchor="middle" fill="#1f2328" font-size="12" font-weight="600">Li-Stephens HMM</text>
  <text x="443" y="572" text-anchor="middle" fill="#57606a" font-size="11">f32 fwd + f64 bwd, dedup</text>

  <rect x="580" y="536" width="270" height="44" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="0.8"/>
  <text x="715" y="554" text-anchor="middle" fill="#1f2328" font-size="12" font-weight="600">Adaptive Ne = 36 &#xd7; n_ref</text>
  <text x="715" y="572" text-anchor="middle" fill="#57606a" font-size="11">MAF-adaptive per-site scaling</text>

  <line x1="305" y1="558" x2="325" y2="558" stroke="#57606a" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="560" y1="558" x2="580" y2="558" stroke="#57606a" stroke-width="1" marker-end="url(#arr)"/>

  <text x="460" y="602" text-anchor="middle" fill="#1f2328" font-size="12">Tiled interpolation (1024 x 4096) · fused interp+encode · L2-cache optimized · streaming I/O</text>
  <text x="460" y="620" text-anchor="middle" fill="#57606a" font-size="11">DR2 two-pass computation · LD-corrected genetic map</text>

  <line x1="460" y1="630" x2="460" y2="656" stroke="#57606a" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- OUTPUT -->
  <rect x="50" y="658" width="820" height="50" rx="10" fill="url(#sg)" stroke="#1a7f37" stroke-width="1.5" filter="url(#sh)"/>
  <text x="460" y="678" text-anchor="middle" fill="#1a7f37" font-size="13" font-weight="700">Multi-Format Output (single interpolation pass)</text>

  <!-- Format pills (centered: total 695px in 820px box, 63px margin each side) -->
  <rect x="113" y="688" width="120" height="18" rx="4" fill="#dafbe1"/>
  <text x="173" y="701" text-anchor="middle" fill="#1a7f37" font-size="11" font-weight="600">VCF.gz</text>
  <rect x="248" y="688" width="120" height="18" rx="4" fill="#dafbe1"/>
  <text x="308" y="701" text-anchor="middle" fill="#1a7f37" font-size="11" font-weight="600">BCF 2.2</text>
  <rect x="383" y="688" width="120" height="18" rx="4" fill="#dafbe1"/>
  <text x="443" y="701" text-anchor="middle" fill="#1a7f37" font-size="11" font-weight="600">Parquet</text>
  <rect x="518" y="688" width="155" height="18" rx="4" fill="#dafbe1"/>
  <text x="596" y="701" text-anchor="middle" fill="#1a7f37" font-size="11" font-weight="600">PGEN + dosage</text>
  <rect x="688" y="688" width="120" height="18" rx="4" fill="#dafbe1"/>
  <text x="748" y="701" text-anchor="middle" fill="#1a7f37" font-size="11" font-weight="600">SelfDecode</text>

  <!-- Multi-chr note -->
  <rect x="50" y="726" width="820" height="32" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="460" y="747" text-anchor="middle" fill="#9a6700" font-size="12">Multi-chromosome: single SRP file, overlapped prefetch | Mixed-density: WGS + chip merged-panel builder</text>

  <!-- LOW-COVERAGE WGS ENGINE (alternative to phasing + imputation) -->
  <rect x="50" y="772" width="820" height="92" rx="10" fill="url(#sg)" stroke="#0d9488" stroke-width="1.5" filter="url(#sh)"/>
  <text x="460" y="795" text-anchor="middle" fill="#0f766e" font-size="14" font-weight="700">Low-Coverage WGS Engine&#xa0;&#xa0;(--lcwgs / --engine lcwgs)</text>
  <text x="460" y="814" text-anchor="middle" fill="#57606a" font-size="11">Alternative to phasing + imputation for low-coverage data — joint GL-aware engine, same panel &amp; output</text>
  <text x="460" y="833" text-anchor="middle" fill="#1f2328" font-size="12">Input: PL VCF/BCF or reads (BAM/CRAM, native pileup) at 0.5&#x2013;2&#xd7; · sparse-PBWT &#x21c4; GL-weighted Li-Stephens FB</text>
  <text x="460" y="852" text-anchor="middle" fill="#1f2328" font-size="12">&#x221a;n-checkpointed, SIMD · diplotype-mosaic phase commitment (Gibbs sampler) &#x2192; GT:DS:GP</text>
</svg>
