<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 812" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#57606a" stroke-width="1.2"/>
    </marker>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f8fa"/>
      <stop offset="100%" stop-color="#eef1f5"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="920" height="812" rx="12" fill="#ffffff"/>

  <text x="460" y="38" text-anchor="middle" fill="#1f2328" font-size="18" font-weight="600">Selphi 2 — Pipeline Architecture</text>

  <!-- INPUT ROW -->
  <rect x="30" y="62" width="195" height="52" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="128" y="84" text-anchor="middle" fill="#1a7f37" font-size="11" font-weight="600">INPUT</text>
  <text x="128" y="101" text-anchor="middle" fill="#1f2328" font-size="13">VCF / BCF / reads</text>

  <rect x="248" y="62" width="195" height="52" rx="8" fill="#ffffff" stroke="#9a6700" stroke-width="1.5"/>
  <text x="346" y="84" text-anchor="middle" fill="#9a6700" font-size="11" font-weight="600">REFERENCE</text>
  <text x="346" y="101" text-anchor="middle" fill="#1f2328" font-size="13">SRP Panel</text>

  <rect x="466" y="62" width="195" height="52" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="564" y="84" text-anchor="middle" fill="#57606a" font-size="11" font-weight="600">GENETIC MAP</text>
  <text x="564" y="101" text-anchor="middle" fill="#1f2328" font-size="13">PLINK / directory</text>

  <rect x="684" y="62" width="205" height="52" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="787" y="84" text-anchor="middle" fill="#8c959f" font-size="11" font-weight="600">OPTIONAL</text>
  <text x="787" y="101" text-anchor="middle" fill="#57606a" font-size="13">Pedigree / Haploids</text>

  <line x1="128" y1="114" x2="128" y2="144" stroke="#57606a" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="346" y1="114" x2="346" y2="144" stroke="#57606a" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- BITMATRIX -->
  <rect x="60" y="146" width="640" height="40" rx="10" fill="url(#sg)" stroke="#8250df" stroke-width="1.5"/>
  <text x="380" y="163" text-anchor="middle" fill="#8250df" font-size="12" font-weight="700">Bitmatrix Extraction</text>
  <text x="380" y="179" text-anchor="middle" fill="#57606a" font-size="11">1 bit per allele · shared between phasing and imputation · SIMD-accelerated</text>

  <line x1="380" y1="186" x2="380" y2="214" stroke="#57606a" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- PHASING: two engines, auto-selected -->
  <rect x="50" y="216" width="820" height="28" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1"/>
  <text x="460" y="235" text-anchor="middle" fill="#0969da" font-size="12" font-weight="600">PHASING (if unphased) — auto by density: chip (up to 50K) &#x2192; haploid | WGS (&gt;50K) &#x2192; diploid</text>

  <rect x="50" y="256" width="400" height="135" rx="10" fill="url(#sg)" stroke="#d9730d" stroke-width="1.5" filter="url(#sh)"/>
  <text x="250" y="280" text-anchor="middle" fill="#bc4c00" font-size="14" font-weight="700">Haploid Engine</text>
  <text x="250" y="303" text-anchor="middle" fill="#1f2328" font-size="12">Coded-step PBWT &#x2192; 280 composites</text>
  <text x="250" y="322" text-anchor="middle" fill="#1f2328" font-size="12">3-channel composite HMM + greedy swap</text>
  <text x="250" y="341" text-anchor="middle" fill="#1f2328" font-size="12">Adaptive step scale + carrier injection</text>
  <text x="250" y="360" text-anchor="middle" fill="#1f2328" font-size="12">EM per-window (Ne, mismatch) · 15 iter</text>
  <text x="250" y="381" text-anchor="middle" fill="#57606a" font-size="10">Optimal for chip arrays</text>

  <rect x="470" y="256" width="400" height="135" rx="10" fill="url(#sg)" stroke="#0969da" stroke-width="1.5" filter="url(#sh)"/>
  <text x="670" y="280" text-anchor="middle" fill="#0969da" font-size="14" font-weight="700">Diploid Engine</text>
  <text x="670" y="303" text-anchor="middle" fill="#1f2328" font-size="12">Genotype graph + MCMC (5b,3xp/b,5m)</text>
  <text x="670" y="322" text-anchor="middle" fill="#1f2328" font-size="12">EM Ne estimation during burn-in</text>
  <text x="670" y="341" text-anchor="middle" fill="#1f2328" font-size="12">Common &#x2192; rare two-stage phasing</text>
  <text x="670" y="360" text-anchor="middle" fill="#1f2328" font-size="12">IBD2-aware PBWT + singleton IBD</text>
  <text x="670" y="381" text-anchor="middle" fill="#57606a" font-size="10">Optimal for WGS</text>

  <!-- Pedigree arrow -->
  <path d="M787 114 L787 190 L885 190 L885 310 L870 310" fill="none" stroke="#8c959f" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="895" y="255" fill="#8c959f" font-size="9" transform="rotate(90,895,255)" text-anchor="middle">Mendelian scaffold</text>

  <!-- Bypass arrow for pre-phased -->
  <path d="M 28 114 L 12 114 L 12 560 L 48 560" fill="none" stroke="#0969da" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr)"/>
  <text x="5" y="335" fill="#0969da" font-size="10" font-weight="600" transform="rotate(-90,5,335)" text-anchor="middle">pre-phased -> skip</text>

  <!-- In-memory handoff -->
  <rect x="140" y="445" width="640" height="28" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="460" y="464" text-anchor="middle" fill="#1a7f37" font-size="11">In-memory handoff: phased haplotypes + reference bitmatrix (no intermediate I/O)</text>

  <line x1="460" y1="473" x2="460" y2="498" stroke="#57606a" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- IMPUTATION: two engines, auto-selected by input -->
  <rect x="50" y="500" width="820" height="186" rx="10" fill="url(#sg)" stroke="#bf3989" stroke-width="1.5" filter="url(#sh)"/>
  <text x="460" y="522" text-anchor="middle" fill="#bf3989" font-size="14" font-weight="700">Imputation Engine</text>
  <text x="460" y="539" text-anchor="middle" fill="#57606a" font-size="11">auto-select by input: confident genotypes &#x2192; genotype engine | low-coverage GL / reads &#x2192; lcWGS engine</text>

  <!-- Genotype imputation -->
  <rect x="70" y="550" width="380" height="102" rx="8" fill="#ffffff" stroke="#bf3989" stroke-width="1.2"/>
  <text x="260" y="571" text-anchor="middle" fill="#a81b6b" font-size="13" font-weight="700">Genotype Imputation</text>
  <text x="260" y="587" text-anchor="middle" fill="#57606a" font-size="10">chip / WGS confident hard calls</text>
  <text x="260" y="607" text-anchor="middle" fill="#1f2328" font-size="11.5">PBWT selection + Li-Stephens HMM (f32/f64)</text>
  <text x="260" y="625" text-anchor="middle" fill="#1f2328" font-size="11.5">Haplotype dedup · Adaptive Ne = 36 &#xd7; n_ref</text>
  <text x="260" y="645" text-anchor="middle" fill="#bf3989" font-size="10" font-style="italic">hard calls in &#x2192; dosages out</text>

  <!-- Low-coverage WGS imputation -->
  <rect x="490" y="550" width="380" height="102" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.2"/>
  <text x="680" y="571" text-anchor="middle" fill="#0f766e" font-size="13" font-weight="700">Low-Coverage WGS Imputation</text>
  <text x="680" y="587" text-anchor="middle" fill="#57606a" font-size="10">0.5&#x2013;2&#xd7; sequencing (genotype likelihoods)</text>
  <text x="680" y="607" text-anchor="middle" fill="#1f2328" font-size="11.5">PL VCF / BAM / CRAM · sparse-PBWT &#x21c4; GL-weighted FB</text>
  <text x="680" y="625" text-anchor="middle" fill="#1f2328" font-size="11.5">&#x221a;n-checkpointed · diplotype-mosaic Gibbs</text>
  <text x="680" y="645" text-anchor="middle" fill="#0d9488" font-size="10" font-style="italic">GLs in &#x2192; GT:DS:GP out</text>

  <!-- shared interpolation -->
  <text x="460" y="673" text-anchor="middle" fill="#1f2328" font-size="11">Tiled interpolation (1024 &#xd7; 4096, L2-cache) · fused interp&#x2192;encode&#x2192;stream · DR2 two-pass · LD-corrected</text>

  <line x1="460" y1="686" x2="460" y2="710" stroke="#57606a" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- OUTPUT -->
  <rect x="50" y="712" width="820" height="50" rx="10" fill="url(#sg)" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="460" y="732" text-anchor="middle" fill="#1a7f37" font-size="13" font-weight="700">Multi-Format Output (single interpolation pass)</text>
  <rect x="113" y="742" width="120" height="18" rx="4" fill="#dafbe1"/>
  <text x="173" y="755" text-anchor="middle" fill="#1a7f37" font-size="11" font-weight="600">VCF.gz</text>
  <rect x="248" y="742" width="120" height="18" rx="4" fill="#dafbe1"/>
  <text x="308" y="755" text-anchor="middle" fill="#1a7f37" font-size="11" font-weight="600">BCF 2.2</text>
  <rect x="383" y="742" width="120" height="18" rx="4" fill="#dafbe1"/>
  <text x="443" y="755" text-anchor="middle" fill="#1a7f37" font-size="11" font-weight="600">Parquet</text>
  <rect x="518" y="742" width="155" height="18" rx="4" fill="#dafbe1"/>
  <text x="596" y="755" text-anchor="middle" fill="#1a7f37" font-size="11" font-weight="600">PGEN + dosage</text>
  <rect x="688" y="742" width="120" height="18" rx="4" fill="#dafbe1"/>
  <text x="748" y="755" text-anchor="middle" fill="#1a7f37" font-size="11" font-weight="600">SelfDecode</text>

  <!-- Multi-chr note -->
  <rect x="50" y="774" width="820" height="28" rx="6" fill="#ffffff" stroke="#9a6700" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="460" y="793" text-anchor="middle" fill="#9a6700" font-size="11">Multi-chromosome: single SRP file, overlapped prefetch | Mixed-density: WGS + chip merged-panel builder</text>
</svg>
